<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الحقيبة الإلكترونية – القدرات العامة (القسم اللفظي)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7fb;--surface:#ffffff;--soft:#e8f1fa;--line:#d5e2ef;--ink:#1c2433;--muted:#5f6b7a;--navy:#1b2d4f;--sky:#3a8fd1;--sky2:#5aa9e6;--ok:#2e8b62;--okbg:#e6f4ec;--bad:#c2453f;--badbg:#fbeaea;--pat:#dfe6ef}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1726;--surface:#17223a;--soft:#1d2c48;--line:#2a3b5c;--ink:#e6edf7;--muted:#9fb0c6;--navy:#cfe0f5;--sky:#6fb3ea;--sky2:#8cc4ee;--ok:#5fc495;--okbg:#173327;--bad:#ee7a74;--badbg:#3a1c1c;--pat:#1f2c45}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1726;--surface:#17223a;--soft:#1d2c48;--line:#2a3b5c;--ink:#e6edf7;--muted:#9fb0c6;--navy:#cfe0f5;--sky:#6fb3ea;--sky2:#8cc4ee;--ok:#5fc495;--okbg:#173327;--bad:#ee7a74;--badbg:#3a1c1c;--pat:#1f2c45}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal","Segoe UI","Geeza Pro","Noto Sans Arabic",Tahoma,sans-serif;font-size:17px;line-height:1.7}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 18px 48px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.bar .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 18px}
.bar h1{font-size:18px;margin:0;font-weight:700;color:var(--navy);flex:1}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 12px;cursor:pointer}
/* hero */
.hero{position:relative;overflow:hidden;margin:0 -18px 8px;padding:42px 22px 34px;background:var(--surface);border-bottom:1px solid var(--line)}
.hero svg.pat{position:absolute;inset:0;width:100%;height:100%;color:var(--pat)}
.hero .c{position:relative}
.pill{display:inline-block;background:var(--navy);color:var(--surface);border-radius:999px;padding:3px 16px;font-weight:700;font-size:15px}
:root[data-theme="dark"] .pill{background:var(--sky);color:#0f1726}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill{background:var(--sky);color:#0f1726}}
.hero h2{font-size:clamp(34px,8vw,52px);line-height:1.15;margin:14px 0 6px;font-weight:800;color:var(--navy)}
.hero p{margin:0;color:var(--muted)}
.overall{display:flex;align-items:center;gap:14px;margin-top:22px}
.meter{flex:1;height:10px;background:var(--soft);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--sky);border-radius:99px;transition:width .4s}
h3.sec{font-size:15px;color:var(--muted);font-weight:700;margin:26px 0 10px}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--surface)}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;text-decoration:none;color:inherit;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row:hover{background:var(--soft)}
.ic{width:46px;height:46px;border-radius:50%;background:var(--navy);display:grid;place-items:center;flex:none}
.ic svg{width:26px;height:26px;color:var(--surface)}
:root[data-theme="dark"] .ic{background:var(--sky)} :root[data-theme="dark"] .ic svg{color:#0f1726}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ic{background:var(--sky)} :root:not([data-theme="light"]) .ic svg{color:#0f1726}}
.row b{display:block;font-size:18px;color:var(--navy)}
.row small{color:var(--muted);font-size:14px}
.row .score{font-weight:700;color:var(--sky);font-size:15px;white-space:nowrap}
.feature{display:flex;gap:16px;align-items:center;margin-top:12px;padding:18px;border-radius:18px;background:var(--navy);color:var(--surface);text-decoration:none}
.feature b{font-size:20px;display:block}
.feature small{opacity:.85}
.feature.alt{background:var(--surface);color:var(--ink);border:2px solid var(--sky)}
.feature.alt b{color:var(--navy)}
:root[data-theme="dark"] .feature:not(.alt){background:#22365c;color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .feature:not(.alt){background:#22365c;color:var(--ink)}}
/* skill */
.tabs{display:flex;gap:6px;background:var(--soft);padding:5px;border-radius:14px;margin:18px 0}
.tabs button{flex:1;border:0;background:none;padding:9px;border-radius:10px;cursor:pointer;font-weight:700;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--navy);box-shadow:0 1px 0 var(--line)}
.def{background:var(--navy);color:var(--surface);padding:16px 18px;border-radius:16px;margin:0 0 16px}
:root[data-theme="dark"] .def{background:#22365c;color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .def{background:#22365c;color:var(--ink)}}
ol.tips{list-style:none;margin:0;padding:0;counter-reset:t}
ol.tips li{counter-increment:t;display:grid;grid-template-columns:34px 1fr;gap:4px 12px;padding:12px 0;border-bottom:1px dashed var(--line)}
ol.tips li::before{content:counter(t);grid-row:span 2;width:30px;height:30px;border-radius:50%;background:var(--soft);color:var(--navy);display:grid;place-items:center;font-weight:800;font-size:14px}
ol.tips b{color:var(--navy)}
ol.tips span{color:var(--muted)}
.start{display:block;width:100%;margin-top:18px;padding:14px;border:0;border-radius:14px;background:var(--sky);color:#fff;font-weight:800;font-size:18px;cursor:pointer}
/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:15px;margin:14px 0 8px}
.progress{height:6px;background:var(--soft);border-radius:9px;overflow:hidden;margin-bottom:16px}
.progress i{display:block;height:100%;background:var(--sky);transition:width .3s}
.passage{background:var(--soft);border-right:4px solid var(--sky);padding:12px 14px;border-radius:10px;margin-bottom:14px;font-size:16px;max-height:220px;overflow:auto}
.qtext{font-size:22px;font-weight:700;color:var(--navy);margin:4px 0 16px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:right;width:100%;padding:13px 14px;border:2px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;font-size:18px}
.opt:hover:not([disabled]){border-color:var(--sky)}
.opt .l{width:30px;height:30px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:800;color:var(--navy);flex:none}
.opt.ok{border-color:var(--ok);background:var(--okbg)} .opt.ok .l{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badbg)} .opt.bad .l{background:var(--bad);color:#fff}
.opt.pick{border-color:var(--sky);background:var(--soft)}
.opt[disabled]{cursor:default}
.why{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--okbg);color:var(--ink)}
.why.bad{background:var(--badbg)}
.nav{display:flex;gap:10px;margin-top:18px}
.nav button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700}
.nav .primary{background:var(--navy);color:var(--surface);border-color:var(--navy)}
:root[data-theme="dark"] .nav .primary{background:var(--sky);color:#0f1726;border-color:var(--sky)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .nav .primary{background:var(--sky);color:#0f1726;border-color:var(--sky)}}
.result{text-align:center;padding:26px 10px}
.big{font-size:64px;font-weight:800;color:var(--navy);line-height:1}
.parts{width:100%;border-collapse:collapse;margin-top:18px}
.parts td{padding:10px;border-bottom:1px solid var(--line)}
.parts td:last-child{text-align:left;font-weight:700;color:var(--sky)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--navy)}
/* words */
.search{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-width:38px;padding:4px 8px;cursor:pointer;font-weight:700}
.chips button[aria-pressed="true"]{background:var(--navy);color:var(--surface);border-color:var(--navy)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table.w{width:100%;border-collapse:collapse;min-width:420px}
table.w th{background:var(--navy);color:var(--surface);padding:10px;font-weight:700;text-align:right}
:root[data-theme="dark"] table.w th{background:#22365c;color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) table.w th{background:#22365c;color:var(--ink)}}
table.w td{padding:9px 10px;border-top:1px solid var(--line)}
table.w td.k{font-weight:800;color:var(--navy)} table.w td.c{color:var(--sky);font-weight:700}
.chk{width:22px;height:22px;accent-color:var(--sky)}
.flash{perspective:1000px;margin:18px 0}
.card{position:relative;height:240px;cursor:pointer;transform-style:preserve-3d;transition:transform .5s}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;display:grid;place-items:center;text-align:center;padding:20px;border:2px solid var(--line);background:var(--surface)}
.face.back{transform:rotateY(180deg);background:var(--soft)}
.face .word{font-size:44px;font-weight:800;color:var(--navy)}
.face .m{font-size:20px} .face .c2{color:var(--sky);font-weight:700;margin-top:6px}
.hint{color:var(--muted);font-size:14px;text-align:center}
footer{text-align:center;color:var(--muted);font-size:13px;padding:24px 0 10px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="bar"><div class="in"><button class="iconbtn" id="back" hidden aria-label="رجوع">رجوع</button><h1 id="ttl">الحقيبة الإلكترونية</h1><button class="iconbtn" id="theme" aria-label="تبديل المظهر">◐</button></div></div>

<script>

function skill(id){
  const s=DATA.skills.find(x=>x.id===id); setBar(s.t,true);
  let tab='learn';
  const draw=()=>{
    app.innerHTML=`<div class="tabs" role="tablist"><button role="tab" aria-selected="${tab==='learn'}" data-t="learn">الشرح</button><button role="tab" aria-selected="${tab==='train'}" data-t="train">التدريب</button></div><div id="pane"></div>`;
    app.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw();});
    const pane=document.getElementById('pane');
    if(tab==='learn'){
      pane.innerHTML=`<p class="def">${esc(s.def)}</p><ol class="tips">${s.tips.map(t=>`<li><b>${esc(t[0])}</b><span>${esc(t[1])}</span></li>`).join('')}</ol><button class="start" id="go">ابدئي التدريب (${s.qs.length} سؤالًا)</button>`;
      document.getElementById('go').onclick=()=>{tab='train';draw();};
    } else quiz(pane,s.qs,{instant:true,onEnd:p=>{if(store.best[id]==null||p>store.best[id]){store.best[id]=p;save();}}});
  };
  draw();
}

        if(ans[i]!=null) return; ans[i]=k; const ok=k===q.a; if(ok) score++;
        el.querySelectorAll('.opt').forEach((x,j)=>{x.disabled=true; if(j===q.a) x.classList.add('ok'); else if(j===k) x.classList.add('bad');});
        document.getElementById('fb').innerHTML=`<div class="why${ok?'':' bad'}"><b>${ok?'إجابة صحيحة.':'الإجابة الصحيحة: ('+L[q.a]+')'}</b> ${esc(q.w||'')}</div>`;
        document.getElementById('next').hidden=false; document.getElementById('next').focus();
      } else { ans[i]=k; el.querySelectorAll('.opt').forEach((x,j)=>x.classList.toggle('pick',j===k)); }
    });
    const nx=document.getElementById('next'); nx.onclick=()=>{ if(i<total-1){i++;show();} else end(); };
    const pv=document.getElementById('prev'); if(pv) pv.onclick=()=>{i--;show();};
    window.scrollTo({top:0});
  }
  function tick(){ clearInterval(timer); const f=()=>{const s=Math.floor((Date.now()-t0)/1000);const e=document.getElementById('tm');if(e)e.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}; f(); timer=setInterval(f,1000); }
  function end(){
    clearInterval(timer);
    if(!opt.instant) score=qs.reduce((a,q,k)=>a+(ans[k]===q.a?1:0),0);
    const p=Math.round(100*score/total); opt.onEnd&&opt.onEnd(p);
    const wrong=qs.map((q,k)=>[q,k]).filter(([q,k])=>ans[k]!==q.a);
    let parts='';
    if(opt.parts){ parts='<table class="parts">'+opt.parts.map(pt=>{const c=qs.filter((q,k)=>q.part===pt&&ans[k]===q.a).length;const n=qs.filter(q=>q.part===pt).length;return `<tr><td>${pt}</td><td>${c} / ${n}</td></tr>`}).join('')+'</table>'; }
    el.innerHTML=`<div class="result"><div class="big">${p}%</div><p>أجبتِ إجابة صحيحة عن ${score} من ${total} سؤالًا.${!opt.instant?' الوقت: '+Math.round((Date.now()-t0)/60000)+' دقيقة.':''}</p>${parts}</div>
    <div class="nav"><button class="primary" id="again">إعادة المحاولة</button>${wrong.length?'<button id="rev">مراجعة الأخطاء ('+wrong.length+')</button>':''}</div><div id="revbox"></div>`;
    document.getElementById('again').onclick=()=>{i=0;score=0;ans.fill(null);t0=Date.now();show();};
    const r=document.getElementById('rev'); if(r) r.onclick=()=>{document.getElementById('revbox').innerHTML=wrong.map(([q,k])=>`<div class="why bad" style="margin-top:12px"><b>${esc(q.h)}</b><br>إجابتك: ${ans[k]==null?'لم تُجيبي':esc(q.o[ans[k]])} • الصحيحة: <b>${esc(q.o[q.a])}</b>${q.w?'<br>'+esc(q.w):''}</div>`).join('');r.remove();};
  }
  show();
}

function final(){
  setBar('الاختبار النهائي',true);
  const qs=[]; DATA.final.forEach(p=>p.qs.forEach(q=>qs.push(Object.assign({part:p.t},q))));
  app.innerHTML=`<p class="def">يتكوّن الاختبار من ${qs.length} سؤالًا في خمسة أجزاء. اختاري إجابة لكل سؤال، وتظهر النتيجة وتوزيع الدرجات بعد الإنهاء. خصّصي دقيقة تقريبًا لكل سؤال.</p>
  <table class="parts">${DATA.final.map(p=>`<tr><td>${p.t}</td><td>${p.qs.length} أسئلة</td></tr>`).join('')}</table><button class="start" id="go">ابدئي الاختبار</button>`;
  document.getElementById('go').onclick=()=>quiz(app,qs,{instant:false,parts:DATA.final.map(p=>p.t),onEnd:p=>{if(store.final==null||p>store.final){store.final=p;save();}}});
}

function words(){
  setBar('زاد المفردات',true);
  let mode='list',q='',letter='',fi=0,flip=false;
  const letters=[...new Set(DATA.words.map(w=>w[0]))];
  const draw=()=>{
    app.innerHTML=`<div class="tabs" role="tablist"><button role="tab" aria-selected="${mode==='list'}" data-m="list">الكلمات</button><button role="tab" aria-selected="${mode==='cards'}" data-m="cards">بطاقات الحفظ</button><button role="tab" aria-selected="${mode==='animals'}" data-m="animals">الحيوانات</button></div><div id="pane"></div>`;
    app.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;draw();});
    const pane=document.getElementById('pane');
    if(mode==='list'){
      pane.innerHTML=`<input class="search" id="s" placeholder="ابحثي عن كلمة أو معنى…" value="${esc(q)}"><div class="chips">${['الكل',...letters].map(l=>`<button aria-pressed="${(l==='الكل'&&!letter)||l===letter}" data-l="${l}">${l}</button>`).join('')}</div><div class="tablewrap"><table class="w"><thead><tr><th style="width:44px">حفظت</th><th>الكلمة</th><th>المعنى</th><th>الضد</th></tr></thead><tbody id="tb"></tbody></table></div>`;
      const fill=()=>{const rows=DATA.words.filter(w=>(!letter||w[0]===letter)&&(!q||(w[1]+w[2]+w[3]).includes(q)));
        document.getElementById('tb').innerHTML=rows.length?rows.map(w=>`<tr><td><input type="checkbox" class="chk" data-w="${esc(w[1])}" ${store.known[w[1]]?'checked':''} aria-label="حفظت ${esc(w[1])}"></td><td class="k">${esc(w[1])}</td><td>${esc(w[2])}</td><td class="c">${esc(w[3])}</td></tr>`).join(''):'<tr><td colspan="4" style="text-align:center;color:var(--muted)">لا توجد كلمة مطابقة. جرّبي كلمة أخرى.</td></tr>';
        document.querySelectorAll('.chk').forEach(c=>c.onchange=()=>{store.known[c.dataset.w]=c.checked;save();});};
      fill();
      document.getElementById('s').oninput=e=>{q=e.target.value.trim();fill();};
      pane.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>{letter=b.dataset.l==='الكل'?'':b.dataset.l;draw();});
    } else if(mode==='cards'){
      const w=DATA.words[fi];
      pane.innerHTML=`<div class="flash"><div class="card${flip?' flip':''}" id="cd" tabindex="0" role="button" aria-label="اقلبي البطاقة"><div class="face"><div class="word">${esc(w[1])}</div></div><div class="face back"><div><div class="m">${esc(w[2])}</div><div class="c2">الضد: ${esc(w[3])}</div></div></div></div></div>
      <p class="hint">اضغطي على البطاقة لقلبها • ${fi+1} من ${DATA.words.length}</p><div class="nav"><button id="pv">السابقة</button><button id="rnd">عشوائية</button><button class="primary" id="nx">التالية</button></div>`;
      const cd=document.getElementById('cd'); const tg=()=>{flip=!flip;cd.classList.toggle('flip',flip);}; cd.onclick=tg; cd.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tg();}};
      document.getElementById('nx').onclick=()=>{fi=(fi+1)%DATA.words.length;flip=false;draw();};
      document.getElementById('pv').onclick=()=>{fi=(fi-1+DATA.words.length)%DATA.words.length;flip=false;draw();};
      document.getElementById('rnd').onclick=()=>{fi=Math.floor(Math.random()*DATA.words.length);flip=false;draw();};
    } else {
      pane.innerHTML=`<div class="tablewrap"><table class="w"><thead><tr><th>الحيوان</th><th>صوته</th><th>بيته</th></tr></thead><tbody>${DATA.animals.map(a=>`<tr><td class="k">${esc(a[0])}</td><td>${esc(a[1])}</td><td class="c">${esc(a[2])}</td></tr>`).join('')}</tbody></table></div>
      <h3 class="sec">أصوات الأشياء</h3><div class="tablewrap"><table class="w"><tbody>${DATA.things.map(a=>`<tr><td class="k">${esc(a[0])}</td><td>${esc(a[1])}</td></tr>`).join('')}</tbody></table></div>`;
    }
  };
  draw();
}

const ROUTES={'':home,final,words};
function route(){const h=location.hash.slice(1);if(DATA.skills.some(s=>s.id===h))skill(h);else (ROUTES[h]||home)();window.scrollTo({top:0});}
addEventListener('hashchange',route); route();
</script>
